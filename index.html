<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>핫딜 호텔 이미지 뚝딱이</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

    :root {
      --primary: #FF6B35;
      --primary-dark: #E55A25;
      --primary-light: #FFF0EB;
      --bg: #F5F6FA;
      --card: #fff;
      --text: #1A1A2E;
      --muted: #6B7280;
      --border: #E5E7EB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Header ── */
    header {
      background: #fff; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; gap: 16px;
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--primary); white-space: nowrap; }

    /* ── Search Bar ── */
    .search-wrap { flex: 1; display: flex; gap: 8px; }
    .search-input {
      flex: 1; border: 2px solid var(--border); border-radius: 10px;
      padding: 10px 16px; font-family: inherit; font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-input::placeholder { color: #B0B7C3; }
    .search-btn {
      background: var(--primary); color: #fff; border: none;
      border-radius: 10px; padding: 10px 22px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: background .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .search-btn:hover { background: var(--primary-dark); }
    .search-btn:disabled { background: #D1D5DB; cursor: not-allowed; }

    /* ── Size Toggle ── */
    .size-wrap { display: flex; gap: 6px; flex-shrink: 0; }
    .size-btn {
      border: 2px solid var(--border); background: #fff;
      border-radius: 8px; padding: 7px 14px;
      font-family: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer; color: var(--muted); transition: all .2s;
      line-height: 1.3; text-align: center;
    }
    .size-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .size-btn small { font-weight: 400; opacity: .8; display: block; font-size: 10px; }

    /* ── Main ── */
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

    /* ── States ── */
    .state-box {
      background: #fff; border-radius: 16px; padding: 64px 24px;
      text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .state-box .ico { font-size: 60px; margin-bottom: 16px; }
    .state-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .state-box p { font-size: 14px; color: var(--muted); line-height: 1.7; }

    /* Spinner */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 80px 0; }
    .spinner {
      width: 44px; height: 44px; border: 4px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      background: #FFF0F0; border: 1px solid #FFC0C0; border-radius: 12px;
      padding: 16px 20px; color: #C00000; font-size: 14px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }

    /* ── Results ── */
    .results-meta {
      font-size: 13px; color: var(--muted); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .results-meta strong { color: var(--text); }
    .portrait-note {
      background: #F0FDF4; border: 1px solid #BBF7D0;
      border-radius: 20px; padding: 3px 10px;
      font-size: 11px; color: #166534; font-weight: 600;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .image-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 640px) { .image-grid { grid-template-columns: repeat(3, 1fr); } }

    .img-card {
      background: #fff; border-radius: 12px; overflow: hidden;
      border: 2.5px solid var(--border); cursor: pointer;
      transition: all .2s; position: relative;
    }
    .img-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255,107,53,.15); }
    .img-card.selected { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,.2); }

    .img-card .check {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: var(--primary); color: #fff; border-radius: 50%;
      width: 26px; height: 26px; font-size: 14px;
      display: none; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .img-card.selected .check { display: flex; }

    /* Portrait badge */
    .portrait-badge {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      background: rgba(16,185,129,.9); color: #fff;
      border-radius: 4px; font-size: 10px; font-weight: 700;
      padding: 2px 6px; display: none;
    }
    .img-card.portrait .portrait-badge { display: block; }

    .img-thumb {
      width: 100%; aspect-ratio: 2/3; object-fit: cover;
      display: block; background: #F3F4F6;
    }
    .img-fallback {
      width: 100%; aspect-ratio: 2/3;
      background: linear-gradient(135deg, #F3F4F6, #E5E7EB);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #9CA3AF;
    }
    .img-info { padding: 8px 10px; }
    .img-source { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .img-title {
      font-size: 11px; color: var(--text); line-height: 1.3;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    /* ── Download Panel ── */
    .dl-panel {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden; display: none;
    }
    .dl-panel.show { display: block; }

    .dl-inner { display: flex; gap: 0; }
    @media (max-width: 680px) { .dl-inner { flex-direction: column; } }

    /* Preview */
    .dl-preview {
      background: #F8F9FA; padding: 28px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; flex-shrink: 0; border-right: 1px solid var(--border);
    }
    .dl-preview canvas { border-radius: 8px; border: 1px solid var(--border); display: block; }
    .canvas-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }

    /* Info */
    .dl-info { padding: 28px; flex: 1; }
    .dl-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .dl-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

    .dl-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-pc {
      background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 14px 20px; font-family: inherit;
      font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: background .2s;
    }
    .btn-pc:hover { background: var(--primary-dark); }
    .btn-mo {
      background: var(--primary-light); color: var(--primary); border: none;
      border-radius: 12px; padding: 14px 20px; font-family: inherit;
      font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: background .2s;
    }
    .btn-mo:hover { background: #FFD6C8; }
    .btn-both {
      background: var(--bg); color: var(--text); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 12px 20px; font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .2s; width: 100%; margin-top: 4px;
    }
    .btn-both:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .badge { font-size: 12px; opacity: .75; }

    .btn-reset {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 14px; font-family: inherit; font-size: 12px;
      color: var(--muted); cursor: pointer; margin-top: 12px; width: 100%;
      transition: all .2s;
    }
    .btn-reset:hover { border-color: #EF4444; color: #EF4444; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: #1A1A2E; color: #fff; border-radius: 10px;
      padding: 12px 20px; font-size: 13px; font-weight: 500;
      transform: translateY(80px); opacity: 0; transition: all .3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🏨 뚝딱이</div>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text"
        placeholder="호텔 이름 검색  예: 롯데호텔 부산"
        onkeydown="if(event.key==='Enter') doSearch()" />
      <button class="search-btn" id="searchBtn" onclick="doSearch()">
        <span id="btnIcon">🔍</span>
        <span id="btnText">검색</span>
      </button>
    </div>

    <div class="size-wrap">
      <button class="size-btn active" id="btnPC" onclick="setSize('PC')">
        🖥️ PC<small>724×1086</small>
      </button>
      <button class="size-btn" id="btnMO" onclick="setSize('MO')">
        📱 MO<small>480×720</small>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <!-- Initial state -->
  <div class="state-box" id="stateEmpty">
    <div class="ico">🏝️</div>
    <h3>호텔 이름을 검색해보세요</h3>
    <p>세로형 호텔 이미지를 검색해서 바로 클릭하면<br>PC(724×1086) / MO(480×720) 배너로 자동 변환됩니다.</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SIZES = { PC: { w: 724, h: 1086 }, MO: { w: 480, h: 720 } };
let currentSize = 'PC';
let results = [];
let selectedIdx = null;
let selectedBitmap = null;

// ── Size Toggle ──────────────────────────────────────
function setSize(s) {
  currentSize = s;
  document.getElementById('btnPC').classList.toggle('active', s === 'PC');
  document.getElementById('btnMO').classList.toggle('active', s === 'MO');
  if (selectedBitmap) renderPreview();
}

// ── Search ───────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { toast('호텔 이름을 입력하세요'); return; }

  setBtnLoading(true);
  setMain(`<div class="spinner-wrap"><div class="spinner"></div><p style="font-size:14px;color:var(--muted);">이미지 검색 중...</p></div>`);

  try {
    results = await searchImages(q);
    if (results.length === 0) throw new Error('검색 결과가 없습니다. 다른 이름으로 시도해보세요.');
    renderResults(q);
  } catch(e) {
    setMain(`<div class="error-box">❌ ${e.message}</div>`);
  } finally {
    setBtnLoading(false);
  }
}

// ── DuckDuckGo Image Search (CORS proxy) ────────────
async function searchImages(query) {
  const sites = 'site:booking.com OR site:expedia.com OR site:agoda.com OR site:trip.com OR site:hotelscombined.com';
  const q = `${query} hotel ${sites}`;
  const proxy = url => `https://corsproxy.io/?${encodeURIComponent(url)}`;

  // Step 1: get vqd token
  const initHtml = await fetch(proxy(`https://duckduckgo.com/?q=${encodeURIComponent(q)}&iax=images&ia=images`))
    .then(r => r.text());

  const vqdMatch = initHtml.match(/vqd=['"]?([0-9-]+)['"]?/);
  if (!vqdMatch) throw new Error('검색을 시작할 수 없습니다. 잠시 후 다시 시도해주세요.');
  const vqd = vqdMatch[1];

  // Step 2: fetch image results — Tall layout filter
  const imgJson = await fetch(
    proxy(`https://duckduckgo.com/i.js?q=${encodeURIComponent(q)}&o=json&vqd=${vqd}&f=,,,,,&p=1&s=0`)
  ).then(r => r.json());

  const ALLOWED = ['booking.com', 'expedia.com', 'agoda.com', 'trip.com', 'hotelscombined.com'];

  const items = (imgJson.results || [])
    .map(r => {
      let host = '';
      try { host = new URL(r.url).hostname.replace('www.', ''); } catch {}
      return {
        url:    r.image,
        thumb:  r.thumbnail,
        w:      r.width,
        h:      r.height,
        title:  r.title,
        source: host,
      };
    })
    .filter(r => ALLOWED.some(d => r.source.endsWith(d)));

  if (items.length === 0) throw new Error('허용된 사이트(Booking, Expedia, Agoda, Trip, HotelsCombined)에서 이미지를 찾지 못했습니다. 영문 호텔명으로 다시 시도해보세요.');

  // 최소 해상도 필터 (단변 600px 이상) 후 픽셀 수 기준 내림차순
  const quality = items.filter(r => Math.min(r.w, r.h) >= 600);
  const sorted = (quality.length >= 5 ? quality : items)
    .sort((a, b) => (b.w * b.h) - (a.w * a.h));
  return sorted.slice(0, 10);
}

// ── Render Results ────────────────────────────────────
function renderResults(query) {
  const portraitCount = results.filter(r => r.h > r.w).length;
  let html = `
    <div class="results-meta">
      <strong>"${query}"</strong> 검색 결과 ${results.length}장
      ${portraitCount > 0 ? `<span class="portrait-note">세로형 ${portraitCount}장 포함</span>` : ''}
    </div>
    <div class="image-grid" id="grid">`;

  results.forEach((r, i) => {
    const isPortrait = r.h > r.w;
    html += `
      <div class="img-card${isPortrait ? ' portrait' : ''}" id="card${i}" onclick="selectImage(${i})">
        <div class="check">✓</div>
        <div class="portrait-badge">세로✓</div>
        <img class="img-thumb" src="${r.thumb}" alt="${r.title}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
          loading="lazy" />
        <div class="img-fallback" style="display:none;">🏨</div>
        <div class="img-info">
          <div class="img-source">${r.source}</div>
          <div class="img-title">${r.title}</div>
        </div>
      </div>`;
  });

  html += `</div><div class="dl-panel" id="dlPanel"></div>`;
  setMain(html);
}

// ── Select Image ──────────────────────────────────────
async function selectImage(idx) {
  // Deselect all
  document.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`card${idx}`)?.classList.add('selected');
  selectedIdx = idx;

  const item = results[idx];
  const panel = document.getElementById('dlPanel');
  panel.className = 'dl-panel show';
  panel.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  try {
    selectedBitmap = await loadImageForCanvas(item.url);
    renderDownloadPanel(item);
  } catch {
    // Fallback: try thumbnail
    try {
      selectedBitmap = await loadImageForCanvas(item.thumb);
      renderDownloadPanel(item);
    } catch {
      panel.innerHTML = `<div class="error-box" style="margin:16px;">❌ 이미지를 불러올 수 없습니다. 다른 이미지를 선택해주세요.</div>`;
    }
  }
}

function renderDownloadPanel(item) {
  const panel = document.getElementById('dlPanel');
  const { w, h } = SIZES[currentSize];
  const ph = 280, pw = Math.round(w / h * ph);

  panel.innerHTML = `
    <div class="dl-inner">
      <div class="dl-preview">
        <div class="canvas-label">${currentSize} 미리보기</div>
        <canvas id="previewCanvas" width="${pw}" height="${ph}"></canvas>
      </div>
      <div class="dl-info">
        <div class="dl-title">다운로드</div>
        <div class="dl-sub">${item.source ? item.source + ' · ' : ''}${item.w}×${item.h} 원본 → 배너 규격으로 자동 변환</div>
        <div class="dl-btns">
          <button class="btn-pc" onclick="download('PC')">
            🖥️ PC 배너 저장 <span class="badge">724 × 1086</span>
          </button>
          <button class="btn-mo" onclick="download('MO')">
            📱 MO 배너 저장 <span class="badge">480 × 720</span>
          </button>
          <button class="btn-both" onclick="downloadBoth()">⬇️ PC + MO 모두 저장</button>
        </div>
        <button class="btn-reset" onclick="deselect()">✕ 다른 이미지 선택</button>
      </div>
    </div>`;

  renderPreview();
}

function renderPreview() {
  const canvas = document.getElementById('previewCanvas');
  if (!canvas || !selectedBitmap) return;
  const { w, h } = SIZES[currentSize];
  const ph = 280, pw = Math.round(w / h * ph);
  canvas.width = pw; canvas.height = ph;
  drawCover(canvas.getContext('2d'), selectedBitmap, pw, ph);
}

// ── Download ──────────────────────────────────────────
async function download(size) {
  if (!selectedBitmap) return;
  const { w, h } = SIZES[size];
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  drawCover(canvas.getContext('2d'), selectedBitmap, w, h);

  const hotelName = document.getElementById('searchInput').value.replace(/\s+/g,'_');
  canvas.toBlob(blob => {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: `${hotelName}_${size}_${w}x${h}.jpg`
    });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast(`✅ ${size === 'PC' ? 'PC (724×1086)' : 'MO (480×720)'} 저장 완료!`);
  }, 'image/jpeg', 0.92);
}

async function downloadBoth() {
  await download('PC');
  await new Promise(r => setTimeout(r, 400));
  await download('MO');
}

function deselect() {
  document.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
  selectedIdx = null; selectedBitmap = null;
  const panel = document.getElementById('dlPanel');
  if (panel) { panel.classList.remove('show'); panel.innerHTML = ''; }
}

// ── Draw Cover ────────────────────────────────────────
function drawCover(ctx, src, w, h) {
  const iw = src.naturalWidth || src.width;
  const ih = src.naturalHeight || src.height;
  const scale = Math.max(w/iw, h/ih);
  const sw = iw*scale, sh = ih*scale;
  ctx.fillStyle = '#F3F4F6';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(src, (w-sw)/2, (h-sh)/2, sw, sh);
}

// ── Image Loader (CORS-safe) ──────────────────────────
function loadImageForCanvas(url) {
  const attempts = [
    // 1. Direct with CORS header
    () => loadImg(url, true),
    // 2. corsproxy.io
    () => loadImg(`https://corsproxy.io/?${encodeURIComponent(url)}`, true),
    // 3. allorigins fallback
    () => loadImg(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, true),
  ];

  return attempts.reduce(
    (chain, fn) => chain.catch(() => fn()),
    Promise.reject()
  );
}

function loadImg(src, cors = false) {
  return new Promise((res, rej) => {
    const img = new Image();
    if (cors) img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

// ── UI Helpers ────────────────────────────────────────
function setMain(html) { document.getElementById('main').innerHTML = html; }
function setBtnLoading(on) {
  document.getElementById('searchBtn').disabled = on;
  document.getElementById('btnIcon').textContent = on ? '' : '🔍';
  document.getElementById('btnText').textContent = on ? '검색 중...' : '검색';
}

let _toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
